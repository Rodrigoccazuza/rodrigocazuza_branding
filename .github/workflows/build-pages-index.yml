name: Build GitHub Pages index

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/fonts/**"
      - "public/favicon.svg"
      - "scripts/build-standalone.mjs"
      - ".github/workflows/build-pages-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Generate standalone Pages entry
        run: node scripts/build-standalone.mjs

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build standalone GitHub Pages index"
          git push
